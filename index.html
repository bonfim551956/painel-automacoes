<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Automações do WhatsApp | Óticas Idealize</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F5;
    --surface: #FAFAFA;
    --line: #DCE3E1;
    --text: #1A1A1A;
    --muted: #55605E;
    --teal: #0E7C71;
    --teal-tint: #E2F2EF;
    --orange: #B4501A;
    --orange-brand: #F07327;
    --orange-tint: #FDEDE3;
    --on-teal: #FAFAFA;
    --focus: #F07327;
    --radius-lg: 16px;
    --radius-sm: 8px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F0F0F; --surface: #1A1A1A; --line: #2E3533; --text: #F5F5F5; --muted: #A6B0AE;
      --teal: #3CC4B4; --teal-tint: #12302C; --orange: #F29A5E; --orange-tint: #33200F;
      --on-teal: #0F0F0F; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F0F0F; --surface: #1A1A1A; --line: #2E3533; --text: #F5F5F5; --muted: #A6B0AE;
    --teal: #3CC4B4; --teal-tint: #12302C; --orange: #F29A5E; --orange-tint: #33200F;
    --on-teal: #0F0F0F; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  .brandbar { width: 32px; height: 4px; background: var(--orange-brand); border-radius: 2px; margin-bottom: 12px; }
  h1 { font-size: 24px; line-height: 1.2; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lead { margin: 0; color: var(--muted); font-size: 14px; max-width: 42ch; }
  .updated { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { border-color: var(--teal); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
  .btn.warn { background: var(--orange); border-color: var(--orange); color: var(--on-teal); }

  /* Linha do tempo do cliente */
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 11px; top: 16px; bottom: 16px; width: 2px; background: var(--line);
  }
  .flow { position: relative; padding-left: 40px; padding-bottom: 32px; }
  .flow:last-child { padding-bottom: 0; }
  .node {
    position: absolute; left: 0; top: 20px; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--bg); transition: background .2s, border-color .2s;
  }
  .flow.on .node { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-tint); }
  .moment { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; padding-top: 22px; line-height: 1.2; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 16px; transition: border-color .2s, background .2s;
  }
  .flow.on .panel { border-color: var(--teal); }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .panel h2 { font-size: 20px; line-height: 1.2; font-weight: 700; margin: 0 0 4px; }
  .panel .desc { margin: 0; color: var(--muted); font-size: 14px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .stat { font-size: 12px; padding: 4px 12px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .stat b { color: var(--text); font-weight: 700; }
  .stat.alert { background: var(--orange-tint); color: var(--orange); }
  .stat.alert b { color: var(--orange); }

  /* Interruptor */
  .switch-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .switch {
    position: relative; width: 56px; height: 32px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--line); transition: background .2s; padding: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); transition: transform .2s; box-shadow: 0 1px 2px rgba(15,15,15,.25);
  }
  .switch[aria-checked="true"] { background: var(--teal); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }
  .switch:hover:not([disabled]) { filter: brightness(1.05); }
  .switch[disabled] { opacity: .5; cursor: not-allowed; }
  .switch.busy::after { animation: pulse 1s ease-in-out infinite; }
  .switch.small { width: 44px; height: 24px; }
  .switch.small::after { width: 16px; height: 16px; }
  .switch.small[aria-checked="true"]::after { transform: translateX(20px); }
  .state-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .flow.on .state-label.main { color: var(--teal); }
  @keyframes pulse { 50% { opacity: .4; } }

  /* Confirmação ao ligar */
  .confirm {
    margin-top: 16px; padding: 12px 16px; border-radius: var(--radius-sm);
    background: var(--orange-tint); color: var(--text); font-size: 14px;
  }
  .confirm p { margin: 0 0 12px; }
  .confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Mensagens */
  .disclosure {
    margin-top: 16px; background: none; border: none; padding: 8px 0; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--teal); display: inline-flex; align-items: center; gap: 8px;
  }
  .disclosure .chev { display: inline-block; transition: transform .2s; }
  .disclosure[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .msgs { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .msg { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .msg:last-child { border-bottom: none; padding-bottom: 0; }
  .msg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .msg h3 { font-size: 16px; line-height: 1.2; margin: 0; font-weight: 700; }
  .msg .when { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .msg.off h3, .msg.off .bubble { opacity: .55; }
  .bubble {
    margin-top: 12px; padding: 12px; border-radius: 4px 12px 12px 12px;
    background: var(--teal-tint); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .tag { font-size: 12px; font-weight: 600; color: var(--teal); margin-top: 8px; display: inline-block; }

  /* Estados */
  .notice {
    padding: 16px; border-radius: var(--radius-lg); background: var(--surface);
    border: 1px solid var(--line); font-size: 14px;
  }
  .notice h2 { font-size: 16px; margin: 0 0 4px; }
  .notice p { margin: 0 0 12px; color: var(--muted); }
  .notice p:last-child { margin-bottom: 0; }
  .notice.err { border-color: var(--orange); }
  .inline-err { margin-top: 12px; font-size: 14px; color: var(--orange); }

  .skeleton { height: 128px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); margin-bottom: 24px; animation: pulse 1.4s ease-in-out infinite; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px);
    background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer.note { margin-top: 48px; font-size: 12px; color: var(--muted); }

  @media (min-width: 640px) {
    .wrap { padding-top: 48px; }
    h1 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  /* Login */
  .login { max-width: 400px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .field label { font-size: 14px; font-weight: 600; }
  .field input, .field select, textarea {
    font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; min-height: 48px; width: 100%;
  }
  .field input:focus, .field select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: var(--teal); }
  .field input[aria-invalid="true"] { border-color: var(--orange); }
  .hint { font-size: 12px; color: var(--muted); }
  .login .btn { width: 100%; justify-content: center; min-height: 48px; }

  /* Editor */
  textarea { min-height: 200px; line-height: 1.5; resize: vertical; margin-top: 12px; }
  .editor-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  .chip:hover { border-color: var(--teal); color: var(--teal); }
  .count { font-size: 12px; color: var(--muted); }
  .count.over { color: var(--orange); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .link { background: none; border: none; padding: 8px 0; color: var(--teal); font-size: 14px; font-weight: 600; cursor: pointer; }
  .test { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .test .row { align-items: flex-end; }
  .test .field { margin: 0; flex: 1 1 160px; }
  .stores { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 32px; }
  .stores h2 { font-size: 16px; line-height: 1.2; margin: 0 0 4px; font-weight: 700; }
  .stores > p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .store { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .store:first-of-type { border-top: none; }
  .store b { display: block; font-size: 16px; }
  .store small { font-size: 12px; color: var(--muted); }
  .store small.warn { color: var(--orange); }
  .wrap.wide { max-width: 1120px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -8px 0 24px; overflow-x: auto; }
  .tabbtn { background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabbtn:hover { color: var(--text); }
  .tabbtn[aria-selected="true"] { color: var(--teal); border-bottom-color: var(--teal); }
  .chips2 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip2 { font-size: 12px; font-weight: 600; padding: 4px 12px; min-height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .chip2:hover { border-color: var(--teal); }
  .chip2[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }
  .filters .field { margin: 0; flex: 1 1 150px; }
  .filters .field.grow { flex: 2 1 220px; }
  .filters .field input, .filters .field select { min-height: 40px; padding: 8px 12px; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
  .kpi small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .kpi b { display: block; font-size: 24px; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi.alert b { color: var(--orange); }
  .cards2 { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
  .card h3 { font-size: 16px; line-height: 1.2; margin: 0 0 12px; }
  .hbar { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; }
  .hbar i { display: block; height: 12px; border-radius: 4px; background: var(--teal); min-width: 2px; }
  .hbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
  table.data { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 14px; }
  table.data th { text-align: left; font-size: 12px; color: var(--muted); padding: 12px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; }
  table.data td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data tr:last-child td { border-bottom: none; }
  table.data tbody tr.click { cursor: pointer; }
  table.data tbody tr.click:hover td { background: var(--teal-tint); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { display: block; font-size: 12px; color: var(--muted); }
  .st { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .st.enviado { background: var(--teal-tint); color: var(--teal); }
  .st.pendente { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .st.cancelado, .st.erro { background: var(--orange-tint); color: var(--orange); }
  .prev { color: var(--muted); max-width: 320px; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .more { display: flex; justify-content: center; padding: 16px; }
  .diff { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .diff div { border-radius: var(--radius-sm); padding: 8px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; overflow: auto; }
  .diff .old { background: var(--orange-tint); }
  .diff .new { background: var(--teal-tint); }
  .diff b { display: block; margin-bottom: 4px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(15,15,15,.45); display: flex; justify-content: flex-end; z-index: 20; }
  .modal { background: var(--surface); width: min(480px, 100%); height: 100%; overflow-y: auto; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: -8px 0 24px rgba(15,15,15,.2); }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .modal h2 { font-size: 20px; line-height: 1.2; margin: 0; }
  .tl { list-style: none; margin: 16px 0 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding-bottom: 16px; font-size: 14px; }
  .tl li::before { content: ""; position: absolute; left: -23px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--teal); }
  .tl li.bad::before { background: var(--orange); }
  .tl li.wait::before { background: var(--line); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 14px; margin-top: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .banner { background: var(--orange-tint); border: 1px solid var(--orange); border-radius: 12px; padding: 12px 16px; margin: 0 0 12px; font-size: 14px; }
  .banner b { color: var(--orange); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-right: 6px; vertical-align: 1px; }
  .dot.off { background: var(--orange); }
  .dot.unk { background: var(--line); }
  .alertcfg { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 14px; }
  .alertcfg .row { align-items: flex-end; }
  .alertcfg .field { margin: 0; flex: 1 1 160px; }
  .health { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .health .kpi b { font-size: 16px; color: var(--teal); }
  .health .kpi.alert b { color: var(--orange); }
  @media (min-width: 720px) {
    .kpis { grid-template-columns: repeat(5, 1fr); }
    .cards2 { grid-template-columns: 1fr 1fr; }
    .diff { grid-template-columns: 1fr 1fr; }
    .health { grid-template-columns: repeat(3, 1fr); }
    .modal { padding: 24px; }
  }
  .gap { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .userline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>

    var out = [chips];
    if (d) out.push(el("div", { class: "filters" }, [
      selectEl("aud-autor", "Quem", a.autor, [["", "Todos"]].concat((d.autores || []).map(function (x) { return [x, x]; })), function (v) { a.autor = v; loadAud(); }),
      selectEl("aud-acao", "Tipo de ação", a.acao, [["", "Todas"]].concat((d.acoes || []).map(function (x) { return [x, x]; })), function (v) { a.acao = v; loadAud(); }),
      el("button", { class: "btn", type: "button", text: a.loading ? "Atualizando" : "Atualizar", disabled: a.loading ? "disabled" : null, onclick: loadAud })
    ]));
    if (a.err) out.push(el("div", { class: "notice err", role: "alert" }, [el("h2", { text: "Não foi possível carregar a auditoria" }), el("p", { text: a.err })]));
    if (a.saude) {
      var rot = a.saude.rotinas || [];
      out.push(el("div", { class: "card", style: "margin-bottom:16px" }, [el("h3", { text: "Saúde do sistema" }),
        el("div", { class: "health" }, rot.map(function (j) {
          var bad = !j.ativa || j.ultima_ok === false || j.falhas_24h > 0;
          return el("div", { class: "kpi" + (bad ? " alert" : "") }, [el("small", { text: ROTINA_NOME[j.nome] || j.nome }),
            el("b", { text: !j.ativa ? "Desligada" : j.ultima_ok === false ? "Falhou na última execução" : "OK · " + (j.ultima ? "há " + ago(j.ultima) : "sem execução") }),
            el("span", { class: "sub", text: j.falhas_24h + " falha(s) em 24h" })]);
        }).concat([el("div", { class: "kpi" + (a.saude.erros_envio_24h > 0 ? " alert" : "") }, [el("small", { text: "Mensagens com erro em 24h" }), el("b", { text: String(a.saude.erros_envio_24h || 0) })])]))
      ]));
    }
    if (!d) { out.push(el("div", { class: "skeleton" })); return el("section", null, out); }
    var rows = d.linhas || [];
    out.push(el("div", { class: "tablewrap" }, [rows.length ? el("table", { class: "data" }, [
      el("thead", null, [el("tr", null, ["Quando", "Quem", "Ação", "O que mudou"].map(function (h) { return el("th", { scope: "col", text: h }); }))]),
      el("tbody", null, rows.map(function (x) {
        return el("tr", null, [
          el("td", { class: "num", text: ddhh(x.em) }),
          el("td", { style: "overflow-wrap:anywhere;max-width:220px", text: x.autor }),
          el("td", null, [x.acao, el("span", { class: "sub", text: alvoNome(x.acao, x.alvo) })]),
          el("td", { style: "min-width:280px" }, [mudouEl(x)])
        ]);
      }))
    ]) : el("p", { class: "empty", text: "Nenhuma ação registrada nesse período. A auditoria começou a registrar em 04/11/2026." })]));
    out.push(el("p", { class: "hint", style: "margin-top:12px", text: "O registro de auditoria não pode ser alterado nem apagado." }));
    return el("section", null, out);
  }

  function render() {
    if (!state.data) return;
    var focusLabel = document.activeElement && document.activeElement.getAttribute("aria-label");
    app.textContent = "";
    document.querySelector(".wrap").classList.toggle("wide", state.tab !== "fluxos");
    document.getElementById("footnote").hidden = state.tab !== "fluxos";
    app.appendChild(renderTabs());
    if (state.tab === "rel") app.appendChild(renderRel());
    else if (state.tab === "aud") app.appendChild(renderAud());
    else {
      app.appendChild(renderStores());
      app.appendChild(el("ol", { class: "timeline" }, FLOWS.map(renderFlow)));
    }
    if (state.rel.detalhe) document.body.appendChild(renderDetalhe());
    app.appendChild(el("div", { class: "userline" }, [
      "Conectado como " + ((state.user && state.user.email) || ""),
      el("button", { class: "link", type: "button", text: "Sair", onclick: function () { sb.auth.signOut(); } })
    ]));
    if (focusLabel) {
      var again = Array.prototype.find.call(app.querySelectorAll("[aria-label]"), function (n) { return n.getAttribute("aria-label") === focusLabel; });
      if (again) again.focus();
    }
  }

  function renderError(msg) {
    app.textContent = "";
    app.appendChild(el("div", { class: "notice err", role: "alert" }, [
      el("h2", { text: "Não foi possível abrir o painel" }),
      el("p", { text: msg }),
      el("div", { class: "row" }, [
        el("button", { class: "btn primary", type: "button", text: "Tentar de novo", onclick: function () { app.textContent = ""; app.appendChild(el("div", { class: "skeleton" })); load(); } }),
        el("button", { class: "btn", type: "button", text: "Sair", onclick: function () { sb.auth.signOut(); } })
      ])
    ]));
  }

  document.getElementById("refresh").addEventListener("click", function () { load(); if (state.tab === "rel") loadRel(true); if (state.tab === "aud") loadAud(); });

  // ---------- início ----------
  if (!window.supabase || !window.supabase.createClient) {
    renderError("Não foi possível carregar os componentes do painel. Confira a internet e recarregue a página.");
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  // ---------- entrada pelo Central Idealize (login único) ----------
  // Dentro do Central, o painel pede o token da sessão do Central, troca por um código de uso único
  // (função entrar-central) e abre a sessão da pessoa certa. Fora do Central, nada muda.
  var ORIGENS_CENTRAL = ["https://central.oticasidealize.online", "https://central-idealize.vercel.app"];
  var embutido = (function () { try { return window.self !== window.top; } catch (_) { return true; } })();
  var deCentral = function (e) { return ORIGENS_CENTRAL.indexOf(e.origin) >= 0 && e.source === window.parent; };
  var entrandoCentral = embutido, erroCentral = ""; // dentro do Central, não mostra o login enquanto tenta entrar
  function pedirTokenCentral(ms) {
    return new Promise(function (resolve) {
      var t;
      function ouvir(e) {
        if (!deCentral(e) || !e.data || e.data.tipo !== "central:token" || typeof e.data.token !== "string") return;
        fim(e.data.token);
      }
      function fim(v) { window.removeEventListener("message", ouvir); clearTimeout(t); resolve(v); }
      t = setTimeout(function () { fim(null); }, ms);
      window.addEventListener("message", ouvir);
      window.parent.postMessage({ tipo: "central:pronto", sistema: "automacoes" }, "*");
    });
  }
  function entrarPeloCentral() {
    entrandoCentral = true;
    app.textContent = ""; app.appendChild(el("div", { class: "skeleton" }));
    return pedirTokenCentral(6000).then(function (token) {
      if (!token) return;
      return sb.functions.invoke("entrar-central", { body: { sistema: "automacoes", token: token } }).then(function (res) {
        if (res.error) {
          var ctx = res.error.context;
          return (ctx && ctx.json ? ctx.json() : Promise.resolve({})).catch(function () { return {}; }).then(function (j) {
            throw new Error((j && j.erro) || "Não foi possível entrar pelo Central.");
          });
        }
        if (!res.data || !res.data.token_hash) throw new Error("Não foi possível entrar pelo Central.");
        return sb.auth.verifyOtp({ token_hash: res.data.token_hash, type: "email" }).then(function (r) {
          if (r.error) return sb.auth.verifyOtp({ token_hash: res.data.token_hash, type: "magiclink" });
          return r;
        }).then(function (r) { if (r.error) throw new Error("Não foi possível abrir a sessão pelo Central."); });
      });
    }).catch(function (e) { erroCentral = e.message; }).then(function () {
      entrandoCentral = false;
      return sb.auth.getSession().then(function (r) { if (!(r.data && r.data.session)) renderLogin(erroCentral); });
    });
  }
  if (embutido) {
    // o Central avisa quando a pessoa sai: encerra a sessão só neste aparelho
    window.addEventListener("message", function (e) { if (deCentral(e) && e.data && e.data.tipo === "central:sair") sb.auth.signOut({ scope: "local" }); });
    // uso do painel conta como atividade no Central (o Central encerra após 20 min sem uso)
    var ultimoAviso = 0;
    ["mousedown", "keydown", "touchstart", "scroll"].forEach(function (ev) {
      window.addEventListener(ev, function () {
        var t = Date.now();
        if (t - ultimoAviso > 30000) { ultimoAviso = t; window.parent.postMessage({ tipo: "central:atividade" }, "*"); }
      }, { passive: true });
    });
  }

  sb.auth.onAuthStateChange(function (event, session) {
    var u = session && session.user;
    if (!u) { state.user = null; state.data = null; if (!entrandoCentral) renderLogin(); return; }
    if (state.user && state.user.id === u.id && state.data) return;
    state.user = u; app.textContent = ""; app.appendChild(el("div", { class: "skeleton" })); load();
  });
  if (embutido) {
    // já com sessão do painel neste aparelho: segue nela; sem sessão: entra pelo Central
    sb.auth.getSession().then(function (r) { if (r.data && r.data.session) entrandoCentral = false; else entrarPeloCentral(); });
  }
})();
</script>
</body>
